name: Job Radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run radar
        run: python radar.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain docs/jobs.json)" ]; then
            git config user.name "job-radar"
            git config user.email "actions@github.com"
            git add docs/jobs.json
            git commit -m "job data update"
            git push
          else
            echo "no change"
          fi
